{% extends "base.html" %}
{% set active = 'alerts' %}
{% block title %}Alerts{% endblock %}

{% block content %}
<div class="page fade-up">
    <div class="page-header">
        <div>
            <h1 class="page-title">Alerts</h1>
            <p class="page-subtitle">Security alerts generated from suspicious activity</p>
        </div>
    </div>

    <!-- Filters -->
    <div class="card" style="margin-bottom:16px">
        <div class="filter-row">
            <div class="form-group">
                <label class="form-label">Severity</label>
                <select id="filter-sev" class="form-input" onchange="loadAlerts()">
                    <option value="">All</option>
                    <option value="warning">warning</option>
                    <option value="critical">critical</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select id="filter-status" class="form-input" onchange="loadAlerts()">
                    <option value="false">Open</option>
                    <option value="true">Resolved</option>
                    <option value="">All</option>
                </select>
            </div>
            <div class="form-group" style="align-self:flex-end">
                <button class="btn btn-ghost" onclick="loadAlerts()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 4 23 10 17 10" />
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
                    </svg>
                    Refresh
                </button>
            </div>
        </div>
    </div>

    <div id="alerts-list">
        <div class="center-spinner">
            <div class="spinner"></div>
        </div>
    </div>
</div>

<script>
    function severityBadge(s) {
        const map = { warning: 'badge-yellow', critical: 'badge-red', info: 'badge-blue' };
        return `<span class="badge ${map[s] || 'badge-gray'}">${s}</span>`;
    }

    function relTime(iso) {
        const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
        if (diff < 60) return `${diff}s ago`;
        if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
        return new Date(iso).toLocaleString();
    }

    async function resolveAlert(id, btn) {
        btn.disabled = true;
        try {
            await apiFetch(`/api/alerts/${id}/resolve`, { method: 'PATCH' });
            loadAlerts();
        } catch (e) {
            btn.disabled = false;
            alert('Failed: ' + e.message);
        }
    }

    async function loadAlerts() {
        const el = document.getElementById('alerts-list');
        const sev = document.getElementById('filter-sev').value;
        const status = document.getElementById('filter-status').value;

        let url = '/api/alerts?limit=100';
        if (sev) url += `&severity=${sev}`;
        if (status !== '') url += `&is_resolved=${status}`;

        el.innerHTML = '<div class="center-spinner"><div class="spinner"></div></div>';

        try {
            const data = await apiFetch(url);
            if (!data.items.length) {
                el.innerHTML = '<div class="card"><div class="empty-state"><p>No alerts found 🎉</p></div></div>';
                return;
            }
            el.innerHTML = data.items.map(a => `
        <div class="card alert-card alert-card--${a.severity}" style="margin-bottom:12px">
          <div class="alert-top" style="margin-bottom:6px">
            <strong>${a.title}</strong>
            ${severityBadge(a.severity)}
            ${a.is_resolved
                    ? '<span class="badge badge-green">resolved</span>'
                    : `<button class="btn btn-ghost" style="margin-left:auto;font-size:12px;padding:3px 12px" onclick="resolveAlert(${a.id},this)">Resolve</button>`
                }
          </div>
          <p style="color:var(--text-secondary);font-size:13px;margin-bottom:8px">${a.message}</p>
          <div style="display:flex;gap:16px;font-size:11px;color:var(--text-muted)">
            <span>Server: <strong>${a.hostname}</strong></span>
            <span>Type: <span class="mono">${a.alert_type}</span></span>
            <span>${relTime(a.created_at)}</span>
            ${a.is_resolved && a.resolved_at ? `<span>Resolved: ${relTime(a.resolved_at)}</span>` : ''}
          </div>
        </div>
      `).join('');
        } catch (e) {
            el.innerHTML = `<div class="card"><div class="empty-state"><p>Failed: ${e.message}</p></div></div>`;
        }
    }

    if (window._socket) {
        window._socket.on('alert_resolved', loadAlerts);
    }

    loadAlerts();
    setInterval(loadAlerts, 15000);
</script>
{% endblock %}
