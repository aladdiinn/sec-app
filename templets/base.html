<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}EC2 Security Monitor{% endblock %} — SOC Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        'dark-lighter': '#1e293b',
                        primary: '#3b82f6',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                        success: '#10b981',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Space Grotesk', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); }
        .glow-red { box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
        .glow-blue { box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-dark text-slate-200 min-h-screen">
    {% if not hide_nav %}
    <!-- Sidebar Navigation -->
    <aside class="fixed left-0 top-0 h-full w-64 glass-nav border-r border-slate-800 p-6 z-50 overflow-y-auto">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-primary/20 border border-primary/40 rounded-xl flex items-center justify-center glow-blue">
                <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-tight leading-none">SECUREPULSE</h1>
                <span class="text-[10px] text-primary font-mono font-bold tracking-widest uppercase">SOC Command</span>
            </div>
        </div>

        <nav class="space-y-1.5 text-sm">
            <a href="/" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800/80 rounded-xl transition-all font-medium text-slate-300 hover:text-white">
                <svg class="w-4 h-4 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                Dashboard
            </a>
            <a href="/servers" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800/80 rounded-xl transition-all font-medium text-slate-300 hover:text-white">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2"></path></svg>
                EC2 Instances
            </a>
            <a href="/alerts" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800/80 rounded-xl transition-all font-medium text-slate-300 hover:text-white">
                <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                Alert Logs
            </a>
            <a href="/projects" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800/80 rounded-xl transition-all font-medium text-slate-300 hover:text-white">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                Projects
            </a>
            <a href="/approvals" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800/80 rounded-xl transition-all font-medium text-slate-300 hover:text-white">
                <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Approvals
            </a>
            <a href="/users" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800/80 rounded-xl transition-all font-medium text-slate-300 hover:text-white">
                <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                SOC Analysts
            </a>
            <a href="/threat-intel" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800/80 rounded-xl transition-all font-medium text-slate-300 hover:text-white">
                <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Threat Intel
            </a>
            <a href="/system-health" class="flex items-center gap-3 px-3 py-2.5 hover:bg-slate-800/80 rounded-xl transition-all font-medium text-slate-300 hover:text-white">
                <svg class="w-4 h-4 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                System Health
            </a>

            <div class="pt-4 mt-4 border-t border-slate-800/80 space-y-1">
                <a href="/settings" class="flex items-center gap-3 px-3 py-2 hover:bg-slate-800/80 rounded-xl transition-all font-medium text-slate-400 hover:text-slate-200">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                    Settings
                </a>
                <a href="/logout" class="flex items-center gap-3 px-3 py-2 hover:bg-red-950/40 rounded-xl transition-all font-medium text-red-400 hover:text-red-300">
                    <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </a>
            </div>
        </nav>
    </aside>
    {% endif %}

    <!-- Main Content Area -->
    <main class="{% if not hide_nav %}ml-64{% endif %} p-8 min-h-screen">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
