{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}Login{% endblock %}

{% block extra_css %}
<style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }

    .login-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
            radial-gradient(ellipse 80% 60% at 50% -20%, rgba(59, 130, 246, .18) 0%, transparent 60%),
            radial-gradient(ellipse 60% 40% at 80% 80%, rgba(168, 85, 247, .10) 0%, transparent 50%);
    }
</style>
{% endblock %}

{% block content %}
<div class="login-bg"></div>
<div class="login-card fade-up">
    <div class="login-brand">
        <div class="login-brand-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
        </div>
        <div>
            <h1 class="login-brand-name">SecurePulse</h1>
            <p class="login-brand-sub">Security Monitoring Platform</p>
        </div>
    </div>

    <form id="login-form">
        <div class="form-group">
            <label class="form-label">Email address</label>
            <input type="email" id="email" class="form-input" value="admin@securepulse.local" required autofocus />
        </div>
        <div class="form-group" style="margin-top:14px">
            <label class="form-label">Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" class="form-input" required />
                <button type="button" class="pw-toggle" onclick="togglePw()">
                    <svg id="pw-eye" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
        </div>

        <div id="login-error" class="login-error" style="display:none"></div>

        <button type="submit" class="btn btn-primary login-btn" id="login-btn">
            Sign In
        </button>
    </form>

    <p class="login-hint">Default: admin@securepulse.local / Admin@1234</p>
</div>

<script>
    // Redirect if already logged in
    if (localStorage.getItem('sp_token')) {
        window.location.href = '/dashboard?_cb=' + Date.now();
    }

    function togglePw() {
        const pw = document.getElementById('password');
        pw.type = pw.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const err = document.getElementById('login-error');
        err.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span>';

        try {
            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: document.getElementById('email').value.trim().toLowerCase(),
                    password: document.getElementById('password').value,
                }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Login failed');

            localStorage.setItem('sp_token', data.access_token);
            localStorage.setItem('sp_user', JSON.stringify({
                id: data.user_id, email: data.email,
                full_name: data.full_name, is_admin: data.is_admin,
            }));
            window.location.href = '/dashboard?_cb=' + Date.now();
        } catch (ex) {
            err.textContent = ex.message;
            err.style.display = 'flex';
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    });
</script>
{% endblock %}
