# ==============================================================================
# BSmart SOC Command Center — Production HAProxy Configuration
# TLS 1.2/1.3 Termination, HTTP->HTTPS Redirection, Proxy Headers, SSE Streaming
# ==============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    tune.ssl.default-dh-param 2048

    # Modern TLS Security & Strong Cipher Suites
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor

    # Connection and Request Timeouts
    timeout connect 5000ms
    timeout client  60000ms
    timeout server  60000ms
    # 1-hour tunnel timeout for SSE / WebSocket real-time live event feeds
    timeout tunnel  3600s
    timeout http-keep-alive 15s

# ──────────────────────────────────────────────────────────────────────────────
# 1. Frontend: HTTP Port 80 (Automatic HTTPS Redirection)
# ──────────────────────────────────────────────────────────────────────────────
frontend http_in
    bind *:80
    mode http

    # ACME Challenge verification for Let's Encrypt / Certbot renewals
    acl is_acme path_beg /.well-known/acme-challenge/
    use_backend acme_backend if is_acme

    # Redirect all HTTP traffic to HTTPS port 443 with 301 Permanent Redirect
    redirect scheme https code 301 if !{ ssl_fc } !is_acme

# ──────────────────────────────────────────────────────────────────────────────
# 2. Frontend: HTTPS Port 443 (TLS Termination & Security Hardening)
# ──────────────────────────────────────────────────────────────────────────────
frontend https_in
    # HAProxy requires certificate + private key in a single combined.pem file
    bind *:443 ssl crt /etc/haproxy/certs/combined.pem alpn h2,http/1.1
    mode http

    # Proxy Headers for SOC Client IP Resolution & Audit Logs
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Real-IP %[src]
    http-request add-header X-Forwarded-For %[src]

    # Security Response Headers
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"

    # Route all traffic to the FastAPI application backend
    default_backend soc_app_backend

# ──────────────────────────────────────────────────────────────────────────────
# 3. Backend: FastAPI / Uvicorn Application Nodes
# ──────────────────────────────────────────────────────────────────────────────
backend soc_app_backend
    mode http
    balance roundrobin
    
    # Active Healthcheck via /api/version
    option httpchk GET /api/version
    http-check expect status 200

    # Backend node connected over internal Docker network
    server soc_app_1 sec-app:8000 check inter 5s rise 2 fall 3

# ──────────────────────────────────────────────────────────────────────────────
# 4. Optional: ACME Backend for Automated Certbot Renewals
# ──────────────────────────────────────────────────────────────────────────────
backend acme_backend
    mode http
    server certbot_standalone 127.0.0.1:8888

# ──────────────────────────────────────────────────────────────────────────────
# 5. HAProxy Health & Metrics Dashboard (Port 8404)
# ──────────────────────────────────────────────────────────────────────────────
frontend stats_in
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats auth admin:SocAdminStats@2026
