# ==============================================================================
# BSmart SOC — Production Nginx Reverse Proxy with TLS 443 Configuration
# Target: EC2 Production Host (Ubuntu / Debian / Amazon Linux)
# File: /etc/nginx/sites-available/bsmart_soc.conf
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name 13.232.88.40 soc.bsmartsoc.local; # Replace with your FQDN

    # Allow Let's Encrypt ACME challenge verification over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS port 443
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Hardened HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 13.232.88.40 soc.bsmartsoc.local; # Replace with your FQDN

    # SSL Certificates (Update paths to your Let's Encrypt or custom certificates)
    ssl_certificate /etc/ssl/certs/bsmart_soc.crt;
    ssl_certificate_key /etc/ssl/private/bsmart_soc.key;

    # Modern TLS Security Protocols & Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # SSL Session Caching & Tickets
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max Upload / Request Body Size (supports batch telemetry up to 25MB)
    client_max_body_size 25M;

    # Fast reverse proxy timeouts
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 3. Upstream FastAPI / Uvicorn Application Server
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket / Server-Sent Events (SSE) streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Accurate Client IP & Host headers for SOC Audit Logging & IP Allowlisting
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffering settings
        proxy_buffering off;
        proxy_redirect off;
    }

    # Static assets caching
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

# WebSocket upgrade map (place in /etc/nginx/conf.d/websocket.conf or http block)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
