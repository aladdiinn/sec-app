{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">User Management (USERNAME)</h2>
    <div class="card bg-dark text-white p-3">
        <table class="table table-dark table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>USERNAME</th>
                    <th>EMAIL</th>
                    <th>ROLE</th>
                    <th>STATUS</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.id }}</td>
                    <td>{{ u.username or u.email }}</td>
                    <td>{{ u.email }}</td>
                    <td><span class="badge bg-info">{{ u.role }}</span></td>
                    <td><span class="badge bg-success">ACTIVE</span></td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteUser({{ u.id }})">Delete</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
<script>
function deleteUser(uid) {
    fetch('/api/users/' + uid, {method: 'DELETE'})
    .then(r => r.json())
    .then(data => location.reload());
}
</script>
{% endblock %}
