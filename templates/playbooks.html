{% extends "base.html" %}
{% set active = 'playbooks' %}
{% block page_title %}Playbooks{% endblock %}
{% block page_sub %}Automated incident response workflows{% endblock %}

{% block content %}
<div class="fade-in">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px">
        <h2 class="card-title">Response Playbooks</h2>
        <button class="btn btn-primary" onclick="openCreateModal()">Create Playbook</button>
    </div>

    <div id="playbooks-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px">
        <!-- Playbooks loaded here -->
    </div>
</div>

<!-- Create Modal -->
<div id="create-modal" class="glass" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); padding:30px; z-index:100; border-radius:8px; width:450px; box-shadow:0 10px 40px rgba(0,0,0,0.5)">
    <h3 class="card-title" style="margin-bottom:16px">Create Playbook</h3>
    <form id="create-form" onsubmit="submitForm(event)">
        <div style="margin-bottom:12px">
            <label class="text-meta">Playbook Name</label>
            <input id="name" type="text" class="glass" style="width:100%; padding:8px" required>
        </div>
        <div style="margin-bottom:12px">
            <label class="text-meta">Trigger Condition</label>
            <input id="trigger_condition" type="text" class="glass" style="width:100%; padding:8px" placeholder="e.g. severity == 'critical'" required>
        </div>
        <div style="margin-bottom:12px">
            <label class="text-meta">Steps (Newline separated)</label>
            <textarea id="steps" class="glass" style="width:100%; padding:8px; height:80px" required></textarea>
        </div>
        <div style="margin-bottom:20px">
            <label class="text-meta">Actions</label>
            <div style="display:flex; gap:10px; margin-top:5px">
                <label><input type="checkbox" id="action-isolate" value="isolate"> Isolate Host</label>
                <label><input type="checkbox" id="action-block" value="block_ip"> Block IP</label>
                <label><input type="checkbox" id="action-notify" value="notify"> Notify Team</label>
            </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px">
            <button type="button" class="btn btn-glass" onclick="closeCreateModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-submit">Save</button>
        </div>
    </form>
</div>

<!-- Run Modal -->
<div id="run-modal" class="glass" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); padding:30px; z-index:100; border-radius:8px; width:400px; box-shadow:0 10px 40px rgba(0,0,0,0.5)">
    <h3 class="card-title" style="margin-bottom:16px">Run Playbook</h3>
    <div style="margin-bottom:20px">
        <label class="text-meta">Target Alert</label>
        <select id="target_alert" class="glass" style="width:100%; padding:8px">
            <option value="">Select Alert...</option>
        </select>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:10px">
        <button type="button" class="btn btn-glass" onclick="closeRunModal()">Cancel</button>
        <button type="button" class="btn btn-primary" id="btn-run" onclick="executePlaybook()">Execute</button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentPlaybookId = null;

function renderActions(actions) {
    if (!actions) return '';
    let arr = actions;
    if (typeof arr === 'string') {
        try { arr = JSON.parse(arr); } catch(e) { arr = [arr]; }
    }
    if (!Array.isArray(arr)) arr = [arr];
    return arr.map(a => {
        let txt = typeof a === 'object' ? (a.type || a.name || a.action || 'ACTION') : String(a);
        txt = txt.replace(/_/g, ' ').toUpperCase();
        return `<span class="badge badge-info" style="margin-right:6px; font-size:11px; padding:3px 8px">${txt}</span>`;
    }).join('');
}

async function loadData() {
    try {
        const data = await apiFetch('/api/playbooks');
        const grid = document.getElementById('playbooks-grid');
        const playbooks = Array.isArray(data) ? data : (data && data.items ? data.items : []);
        if (playbooks.length === 0) {
            grid.innerHTML = '<div class="card glass" style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted)">No playbooks found. Click "Create Playbook" to add one.</div>';
        } else {
            grid.innerHTML = playbooks.map(pb => `
                <div class="card glass fade-in" id="pb-${pb.id}" style="display:flex; flex-direction:column; justify-content:space-between; padding:20px">
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px">
                            <h3 class="card-title" style="font-size:16px; margin:0">${pb.name}</h3>
                            <span class="badge badge-info" style="font-size:10px">SOAR</span>
                        </div>
                        <p class="text-meta" style="margin-bottom:14px; min-height:36px; line-height:1.4; color:var(--text-secondary)">
                            ${pb.trigger_condition || pb.trigger || pb.steps || 'Auto-trigger on matched threat events'}
                        </p>
                        <div style="margin-bottom:16px; display:flex; flex-wrap:wrap; gap:4px">
                            ${renderActions(pb.actions)}
                        </div>
                    </div>
                    <div style="display:flex; gap:10px; margin-top:10px">
                        <button class="btn btn-primary" style="flex:1; padding:8px" onclick="openRunModal(${pb.id}, '${pb.name.replace(/'/g, "\'")}')">
                            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none" style="margin-right:4px"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            Run
                        </button>
                        <button class="btn btn-glass" style="color:var(--accent-red); border-color:var(--accent-red); padding:8px 12px" onclick="deletePlaybook(${pb.id}, this)">
                            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }
    } catch (err) {
        showToast('Failed to load playbooks', 'error');
    }
}

function openCreateModal() {
    document.getElementById('create-form').reset();
    document.getElementById('create-modal').style.display = 'block';
}

function closeCreateModal() {
    document.getElementById('create-modal').style.display = 'none';
}

async function submitForm(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerText = 'Saving...';
    try {
        const actions = [];
        if (document.getElementById('action-isolate').checked) actions.push({type: 'isolate_host'});
        if (document.getElementById('action-block').checked) actions.push({type: 'block_ip'});
        if (document.getElementById('action-notify').checked) actions.push({type: 'notify_team'});
        if (!actions.length) actions.push({type: 'log_incident'});

        const payload = {
            name: document.getElementById('name').value.trim(),
            trigger_condition: document.getElementById('trigger_condition').value.trim(),
            steps: document.getElementById('steps').value.trim(),
            actions: actions
        };
        await apiFetch('/api/playbooks', { method: 'POST', body: JSON.stringify(payload) });
        showToast('Playbook created successfully', 'success');
        closeCreateModal();
        loadData();
    } catch (err) {
        showToast(err.message || 'Failed to create playbook', 'error');
    } finally {
        btn.disabled = false;
        btn.innerText = 'Save';
    }
}

async function deletePlaybook(id, btn) {
    if (!confirm('Delete this playbook? This cannot be undone.')) return;
    btn.disabled = true;
    try {
        await apiFetch(`/api/playbooks/${id}`, { method: 'DELETE' });
        showToast('Playbook deleted', 'success');
        const el = document.getElementById(`pb-${id}`);
        if (el) el.remove();
    } catch (err) {
        showToast('Delete failed', 'error');
        btn.disabled = false;
    }
}

async function openRunModal(id, name) {
    currentPlaybookId = id;
    const sel = document.getElementById('target_alert');
    sel.innerHTML = '<option value="">Loading alerts...</option>';
    document.getElementById('run-modal').style.display = 'block';
    
    try {
        const res = await apiFetch('/api/alerts?limit=50');
        const alerts = Array.isArray(res) ? res : (res && res.items ? res.items : []);
        if (alerts.length === 0) {
            sel.innerHTML = '<option value="1">Alert #1 - General Security Event (Simulation)</option>';
        } else {
            sel.innerHTML = '<option value="">Select target alert...</option>' + alerts.map(a => `
                <option value="${a.id}">Alert #${a.id} - ${a.title || a.message || 'Security Event'}</option>
            `).join('');
        }
    } catch (err) {
        sel.innerHTML = '<option value="1">Alert #1 - General Security Event (Simulation)</option>';
    }
}

function closeRunModal() {
    document.getElementById('run-modal').style.display = 'none';
}

async function executePlaybook() {
    const sel = document.getElementById('target_alert');
    const alertId = sel.value || '1';
    
    const btn = document.getElementById('btn-run');
    btn.disabled = true;
    btn.innerText = 'Executing...';
    try {
        const res = await apiFetch(`/api/playbooks/${currentPlaybookId}/execute/${alertId}`, { method: 'POST' });
        showToast(res.message || 'Playbook executed successfully!', 'success');
        closeRunModal();
    } catch (err) {
        showToast(err.message || 'Execution failed', 'error');
    } finally {
        btn.disabled = false;
        btn.innerText = 'Execute';
    }
}

window.addEventListener('load', loadData);
</script>
{% endblock %}
