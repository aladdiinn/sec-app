{% extends "base.html" %}
{% set active = 'search' %}
{% block page_title %}Global Search{% endblock %}
{% block page_sub %}Search across all infrastructure, alerts, and intelligence{% endblock %}

{% block content %}
<div class="fade-in" style="max-width:900px; margin:0 auto">
    <div class="card glass" style="margin-bottom:24px">
        <form onsubmit="doSearch(event)" style="display:flex; gap:12px">
            <input id="search-q" type="text" class="glass" style="flex:1; padding:12px 16px; font-size:16px; border-radius:8px" placeholder="Search IP, hostname, rule name, or hash..." required>
            <button type="submit" class="btn btn-primary" id="btn-search" style="padding:0 24px">Search</button>
        </form>
    </div>

    <div id="results-container">
        <!-- Results injected here -->
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function doSearch(e) {
    e.preventDefault();
    const q = document.getElementById('search-q').value;
    if (!q) return;

    window.history.pushState({}, '', `?q=${encodeURIComponent(q)}`);
    performSearch(q);
}

async function performSearch(q) {
    const btn = document.getElementById('btn-search');
    const container = document.getElementById('results-container');
    btn.disabled = true;
    btn.innerText = 'Searching...';
    container.innerHTML = '<div class="text-meta" style="text-align:center; padding:40px">Searching...</div>';

    try {
        const data = await apiFetch(`/api/search?q=${encodeURIComponent(q)}`);
        
        let html = '';
        if (data.servers && data.servers.length) {
            html += `
                <div class="card glass" style="margin-bottom:16px">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px">
                        <h3 class="card-title">Servers</h3>
                        <span class="badge badge-info">${data.servers.length}</span>
                    </div>
                    ${data.servers.map(s => `<div style="padding:10px; border-bottom:1px solid var(--border); cursor:pointer" onclick="window.location.href='/servers/${s.id}'" class="glass-hover"><strong>${s.hostname}</strong> - ${s.ip}</div>`).join('')}
                </div>
            `;
        }
        if (data.alerts && data.alerts.length) {
            html += `
                <div class="card glass" style="margin-bottom:16px">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px">
                        <h3 class="card-title">Alerts</h3>
                        <span class="badge badge-warning">${data.alerts.length}</span>
                    </div>
                    ${data.alerts.map(a => `<div style="padding:10px; border-bottom:1px solid var(--border); cursor:pointer" onclick="window.location.href='/incidents'" class="glass-hover"><strong>Alert #${a.id}</strong> - ${a.message}</div>`).join('')}
                </div>
            `;
        }
        if (data.incidents && data.incidents.length) {
            html += `
                <div class="card glass" style="margin-bottom:16px">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px">
                        <h3 class="card-title">Incidents</h3>
                        <span class="badge badge-critical">${data.incidents.length}</span>
                    </div>
                    ${data.incidents.map(i => `<div style="padding:10px; border-bottom:1px solid var(--border); cursor:pointer" onclick="window.location.href='/incidents'" class="glass-hover"><strong>Incident #${i.id}</strong> - ${i.title}</div>`).join('')}
                </div>
            `;
        }
        if (data.commands && data.commands.length) {
            html += `
                <div class="card glass" style="margin-bottom:16px">
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px">
                        <h3 class="card-title">Commands</h3>
                        <span class="badge badge-success">${data.commands.length}</span>
                    </div>
                    ${data.commands.map(c => `<div style="padding:10px; border-bottom:1px solid var(--border); cursor:pointer" onclick="window.location.href='/servers/${c.server_id}/commands'" class="glass-hover"><code>${c.command}</code> (Server #${c.server_id})</div>`).join('')}
                </div>
            `;
        }

        if (!html) {
            html = '<div class="card glass" style="text-align:center; padding:40px">No results found.</div>';
        }

        container.innerHTML = html;
    } catch (err) {
        container.innerHTML = `<div class="card glass" style="color:var(--red); text-align:center; padding:40px">Search failed: ${err.message}</div>`;
    } finally {
        btn.disabled = false;
        btn.innerText = 'Search';
    }
}

window.addEventListener('load', () => {
    const q = new URLSearchParams(window.location.search).get('q');
    if (q) {
        document.getElementById('search-q').value = q;
        performSearch(q);
    }
});
</script>
{% endblock %}
