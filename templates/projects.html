{% extends "base.html" %}
{% set active = 'projects' %}
{% block page_title %}Projects{% endblock %}
{% block page_sub %}Logical groupings of infrastructure and monitoring{% endblock %}

{% block content %}
<div class="fade-in">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px">
        <h2 class="card-title">Projects / Workspaces</h2>
        <button class="btn btn-primary" onclick="openCreateModal()">New Project</button>
    </div>

    <div id="projects-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px">
        <!-- Projects loaded here -->
    </div>
</div>

<!-- Create Modal -->
<div id="create-modal" class="glass" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); padding:30px; z-index:100; border-radius:8px; width:400px; box-shadow:0 10px 40px rgba(0,0,0,0.5)">
    <h3 class="card-title" style="margin-bottom:16px">Create Project</h3>
    <form id="create-form" onsubmit="submitForm(event)">
        <div style="margin-bottom:12px">
            <label class="text-meta">Project Name</label>
            <input id="name" type="text" class="glass" style="width:100%; padding:8px" required>
        </div>
        <div style="margin-bottom:20px">
            <label class="text-meta">Description</label>
            <textarea id="description" class="glass" style="width:100%; padding:8px; height:80px"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:10px">
            <button type="button" class="btn btn-glass" onclick="closeCreateModal()">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-submit">Create</button>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadData() {
    try {
        const data = await apiFetch('/api/projects');
        const grid = document.getElementById('projects-grid');
        if (data.length === 0) {
            grid.innerHTML = '<div class="card glass" style="grid-column: 1/-1; text-align:center; padding:40px">No projects found.</div>';
        } else {
            grid.innerHTML = data.map(p => `
                <div class="card glass fade-in" id="proj-${p.id}" style="position:relative; cursor:pointer" onclick="window.location.href='/projects/${p.id}'">
                    <button onclick="event.stopPropagation(); deleteProject(${p.id}, this)"
                        style="position:absolute; top:12px; right:12px; background:rgba(255,59,92,0.1); border:1px solid rgba(255,59,92,0.4); color:var(--red); border-radius:5px; padding:4px 8px; cursor:pointer; font-size:10px; font-family:var(--mono);">
                        DEL
                    </button>
                    <h3 class="card-title" style="margin-bottom:8px">${p.name}</h3>
                    <p class="text-meta" style="margin-bottom:16px; height:40px; overflow:hidden">${p.description || 'No description'}</p>
                    <div style="display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--border); padding-top:12px">
                        <span class="text-meta">Servers Assigned</span>
                        <span class="badge badge-info">${p.server_count || 0}</span>
                    </div>
                </div>
            `).join('');
        }
    } catch (err) {
        showToast('Failed to load projects', 'error');
    }
}

function openCreateModal() {
    document.getElementById('create-form').reset();
    document.getElementById('create-modal').style.display = 'block';
}

function closeCreateModal() {
    document.getElementById('create-modal').style.display = 'none';
}

async function submitForm(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerText = 'Loading...';
    try {
        const payload = {
            name: document.getElementById('name').value,
            description: document.getElementById('description').value
        };
        await apiFetch('/api/projects', { method: 'POST', body: JSON.stringify(payload) });
        showToast('Project created', 'success');
        closeCreateModal();
        loadData();
    } catch (err) {
        showToast(err.message || 'Failed to create', 'error');
    } finally {
        btn.disabled = false;
        btn.innerText = 'Create';
    }
}

async function deleteProject(id, btn) {
    if (!confirm('Are you sure you want to delete this project?')) return;
    btn.disabled = true;
    btn.innerText = '...';
    try {
        await apiFetch(`/api/projects/${id}`, { method: 'DELETE' });
        showToast('Project deleted', 'success');
        loadData();
    } catch (err) {
        showToast('Delete failed', 'error');
        btn.disabled = false;
        btn.innerText = 'DEL';
    }
}

window.addEventListener('load', loadData);
</script>
{% endblock %}
