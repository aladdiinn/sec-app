{% extends "base.html" %}
{% set active = 'settings' %}
{% block page_title %}Settings{% endblock %}
{% block page_sub %}Dashboard configuration and profile{% endblock %}

{% block content %}
<div class="page fade-up">
    <div class="page-header">
        
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px">
        <!-- Account Settings -->
        <div class="card">
            <div class="card-header"><h3 class="card-title">Account Profile</h3></div>
            <div style="display:flex; flex-direction:column; gap:16px">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="profile-name" class="form-input" value="Loading..." readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="profile-email" class="form-input" value="Loading..." readonly>
                </div>
                <button class="btn btn-primary" disabled>Update Profile</button>
            </div>
        </div>

        <!-- Security Settings -->
        <div class="card">
            <div class="card-header"><h3 class="card-title">Security & API</h3></div>
            <div style="display:flex; flex-direction:column; gap:16px">
                <div class="form-group">
                    <label class="form-label">Agent API Key</label>
                    <div style="display:flex; gap:8px">
                        <input type="password" id="api-key-input" class="form-input" style="flex:1" value="••••••••••••••••" readonly>
                        <button class="btn btn-ghost" onclick="toggleApiKey()">Show</button>
                    </div>
                    <p style="font-size:10px; color:var(--text-muted); margin-top:4px">Used by agents during initial registration.</p>
                </div>
                <div class="form-divider" style="height:1px; background:var(--border); margin:8px 0"></div>
                <div class="form-group">
                    <label class="form-label">Heartbeat Timeout</label>
                    <div style="display:flex; align-items:center; gap:12px">
                        <input type="number" class="form-input" style="width:100px" value="120" readonly>
                        <span style="font-size:12px; color:var(--text-muted)">seconds</span>
                    </div>
                </div>
                <button class="btn btn-danger" onclick="revokeTokens()">Revoke All Agent Tokens</button>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleApiKey() {
        const input = document.getElementById('api-key-input');
        const btn = event.target;
        if (input.type === 'password') {
            // In a real app, fetch the key via API
            input.type = 'text';
            input.value = 'sp-agent-key-9f2a8c1b5d3e7f0a4c6b8d2e1f5a9c3b';
            btn.textContent = 'Hide';
        } else {
            input.type = 'password';
            input.value = '••••••••••••••••';
            btn.textContent = 'Show';
        }
    }

    function revokeTokens() {
        if (confirm("Are you sure you want to revoke all agent tokens? This will disconnect all monitored servers immediately.")) {
            alert("Tokens revoked! (Simulated)");
        }
    }

    document.addEventListener('DOMContentLoaded', async function() {
        try {
            const data = await apiFetch('/auth/me');
            document.getElementById('profile-name').value = data.full_name || 'Not set';
            document.getElementById('profile-email').value = data.email || 'Not set';
        } catch (e) {
            console.error("Failed to load profile:", e);
        }
    });
</script>
{% endblock %}
