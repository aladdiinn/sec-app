{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-3">Active Users & Sessions — {{ server.name or server.hostname }}</h2>
    <ul class="nav nav-tabs mb-3" id="userTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="system-users-tab" data-bs-toggle="tab" data-bs-target="#system-users" type="button" role="tab">TOTAL USERS (/etc/passwd)</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="active-sessions-tab" data-bs-toggle="tab" data-bs-target="#active-sessions" type="button" role="tab">ACTIVE SESSIONS (who -u)</button>
        </li>
    </ul>
    <div class="tab-content" id="userTabsContent">
        <div class="tab-pane fade show active p-3 bg-dark text-white rounded" id="system-users" role="tabpanel">
            <table class="table table-dark table-hover">
                <thead>
                    <tr><th>Username</th><th>UID</th><th>Shell</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="system-users-body">
                    <tr><td>root</td><td>0</td><td>/bin/bash</td><td><span class="badge bg-success">ACTIVE</span></td><td><button class="btn btn-sm btn-outline-warning">Reset PW</button></td></tr>
                    <tr><td>ubuntu</td><td>1000</td><td>/bin/bash</td><td><span class="badge bg-success">ACTIVE</span></td><td><button class="btn btn-sm btn-outline-warning">Reset PW</button></td></tr>
                </tbody>
            </table>
        </div>
        <div class="tab-pane fade p-3 bg-dark text-white rounded" id="active-sessions" role="tabpanel">
            <table class="table table-dark table-hover">
                <thead>
                    <tr><th>User</th><th>TTY</th><th>Login Time</th><th>PID</th><th>IP</th><th>Action</th></tr>
                </thead>
                <tbody id="active-sessions-body">
                    <tr><td>ubuntu</td><td>pts/0</td><td>Just Now</td><td>14205</td><td>{{ server.ip }}</td><td><button class="btn btn-sm btn-danger">Force Logout</button></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
