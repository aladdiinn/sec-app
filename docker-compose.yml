# ==============================================================================
# BSmart SOC Command Center — Production Docker Compose Stack
# Multi-container deployment with dedicated PostgreSQL database
# Paths: /application/Soc
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Dedicated PostgreSQL Database Container
  # ----------------------------------------------------------------------------
  soc-db:
    image: postgres:15-alpine
    container_name: bsmart-soc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bsmart_soc}
      POSTGRES_USER: ${DB_USER:-socadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SocSecurePass2026_db}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      # Persistent host data storage (dedicated isolated database)
      - /application/Soc/SOC-DB:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-socadmin} -d ${DB_NAME:-bsmart_soc}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - soc-network

  # ----------------------------------------------------------------------------
  # BSmart SOC Application Container (FastAPI + Uvicorn)
  # ----------------------------------------------------------------------------
  soc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-mannan070/soc:latest}
    container_name: bsmart-soc-app
    restart: unless-stopped
    depends_on:
      soc-db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    env_file:
      - /application/Soc/.env
    ports:
      # Bound to loopback port 8001 (avoids collision with host services like GitLab on port 8000)
      - "127.0.0.1:8001:8001"
    volumes:
      # Persistent host-mounted storage (logs, offline GeoIP database, local state)
      - /application/Soc/logs:/app/logs
      - /application/Soc/data:/app/data
      - /application/Soc/app.py:/app/app.py
      - /application/Soc/database.py:/app/database.py
      - /application/Soc/templates:/app/templates
      - /application/Soc/static:/app/static
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8001/api/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge
