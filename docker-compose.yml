# ==============================================================================
# BSmart SOC Command Center — Production Docker Compose Deployment
# Reads secrets strictly from /opt/soc/.env at runtime (never baked into image)
# Bound to 127.0.0.1:8000 for host reverse proxy (Nginx or existing host HAProxy)
# ==============================================================================

services:
  soc:
    image: ${DOCKER_IMAGE:-ghcr.io/aladdiinn/sec-app:latest}
    container_name: bsmart-soc-app
    restart: unless-stopped
    env_file:
      - /opt/soc/.env
    ports:
      # Bound strictly to loopback 127.0.0.1 (not 0.0.0.0) so only the host reverse proxy can reach it
      - "127.0.0.1:8000:8000"
    volumes:
      # Persistent host-mounted storage (logs, offline GeoIP database, local state)
      - /opt/soc/logs:/app/logs
      - /opt/soc/data:/app/data
    extra_hosts:
      # Resolves host.docker.internal to access host services (e.g. host PostgreSQL on port 5432)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
