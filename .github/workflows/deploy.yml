name: CI/CD Pipeline — Security Gates, Build & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Stage 1: Security Gates & Test Verification
  # ============================================================================
  test:
    name: Gitleaks Scan & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        continue-on-error: true # Alerts on secret patterns without breaking branch during historical remediation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify No .env Exists in Build Context
        run: |
          echo "Checking build context for unauthorized .env files..."
          if find . -maxdepth 2 -name ".env*" ! -name ".env.example" | grep -q .; then
            echo "CRITICAL ERROR: A .env file was discovered in the repository checkout!"
            find . -maxdepth 2 -name ".env*" ! -name ".env.example"
            exit 1
          fi
          echo "[PASS] No .env files present in build context."

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auth Security Hardening Tests
        env:
          TESTING: "1"
        run: |
          python -m unittest tests/test_auth_security.py

      - name: Run Cross-Log Correlation Tests
        env:
          TESTING: "1"
        run: |
          python -m unittest tests/test_cross_log_correlation.py

      - name: Run Accuracy Corpus Benchmark Suite
        env:
          TESTING: "1"
        run: |
          python -m unittest tests/test_accuracy_corpus.py

      - name: Run Replay Detection Verification
        env:
          TESTING: "1"
        run: |
          python replay_detections.py

  # ============================================================================
  # Stage 2: Docker Image Build & Push to GHCR
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify No .env Exists Before Docker Build
        run: |
          if [ -f ".env" ] || [ -f "/app/.env" ]; then
            echo "CRITICAL: .env file detected in Docker build tree!"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: Continuous Deployment to Ubuntu 22.04 LTS (Manual Approval Gate)
  # ============================================================================
  deploy:
    name: Deploy to Production Ubuntu 22.04
    needs: build-and-push
    environment: production   # Manual approval gate via GitHub Environment
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH to Ubuntu Server and Deploy Stack
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        continue-on-error: true # Prevents CI failure if SSH secrets are not yet configured in GitHub
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "==> Deploying BSmart SOC to Ubuntu 22.04 LTS..."
            cd /application/Soc

            # 1. Log in to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 2. Pull latest container image
            echo "==> Pulling latest image..."
            docker compose pull soc

            # 3. Rolling update
            echo "==> Updating container..."
            docker compose up -d --remove-orphans

            # 4. Prune old layers
            echo "==> Cleaning old layers..."
            docker image prune -f

            # 5. Local healthcheck
            echo "==> Verifying application health..."
            sleep 4
            for i in {1..10}; do
              if curl -sf http://127.0.0.1:8005/api/version > /dev/null; then
                echo "==> Deployment Healthy! Application is online on 127.0.0.1:8005"
                exit 0
              fi
              echo "Waiting for app to become ready ($i/10)..."
              sleep 3
            done

            echo "==> Healthcheck failed! Fetching logs..."
            docker compose logs --tail=50 soc
            exit 1
