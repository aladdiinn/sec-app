name: CI/CD Pipeline — Test, Build & Deploy to Ubuntu 22.04

on:
  push:
    branches:
      - main
      - app-siem
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Stage 1: Quality Gate & Test Verification
  # ============================================================================
  test:
    name: Run Unit Tests & Accuracy Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auth Security Hardening Tests
        run: |
          python -m unittest tests/test_auth_security.py

      - name: Run Cross-Log Correlation Tests
        run: |
          python -m unittest tests/test_cross_log_correlation.py

      - name: Run Accuracy Corpus Benchmark Suite
        run: |
          python -m unittest tests/test_accuracy_corpus.py

      - name: Run Replay Detection Verification
        run: |
          python replay_detections.py

  # ============================================================================
  # Stage 2: Docker Image Build & Push to GHCR
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 3: Continuous Deployment to Ubuntu 22.04 LTS via HAProxy Stack
  # ============================================================================
  deploy:
    name: Deploy to Production Ubuntu 22.04
    needs: build-and-push
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/app-siem') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH to Ubuntu Server and Deploy Stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "==> Deploying BSmart SOC to Ubuntu 22.04 LTS..."
            cd /opt/bsmart-soc

            # 1. Log in to GHCR to pull newly built image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 2. Pull latest container image
            echo "==> Pulling latest images..."
            docker compose pull sec-app

            # 3. Restart services with zero-downtime rolling update
            echo "==> Updating containers..."
            docker compose up -d --remove-orphans

            # 4. Clean up dangling images to preserve disk space
            echo "==> Cleaning stale image layers..."
            docker image prune -f

            # 5. Verify local healthcheck
            echo "==> Verifying application healthcheck..."
            sleep 5
            for i in {1..10}; do
              if docker compose exec -T sec-app curl -sf http://127.0.0.1:8000/api/version > /dev/null; then
                echo "==> Healthcheck Passed! Application is online."
                exit 0
              fi
              echo "Waiting for backend service to become healthy ($i/10)..."
              sleep 3
            done

            echo "==> Healthcheck failed! Inspecting logs..."
            docker compose logs --tail=50 sec-app
            exit 1
