[SERVICE]
    Flush        1
    Log_Level    info
    Daemon       off

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[INPUT]
    Name         syslog
    Mode         udp
    Listen       0.0.0.0
    Port         5140
    Parser       syslog-rfc3164

[FILTER]
    Name         record_modifier
    Match        *
    Record       ingested_by soc-fluent-bit

[OUTPUT]
    Name            opensearch
    Match           *
    Host            opensearch
    Port            9200
    Index           security-logs
    Type            _doc
    HTTP_User       admin
    HTTP_Passwd     password
    tls             Off
    Suppress_Type_Name On
