<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePulse SOC | Asset Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        'dark-lighter': '#1e293b',
                        primary: '#3b82f6',
                        success: '#10b981',
                        danger: '#ef4444',
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-dark text-slate-200 font-sans min-h-screen">

    <!-- Sidebar (Shared with Dashboard) -->
    <div class="fixed left-0 top-0 h-full w-64 glass border-r border-slate-800 p-6 z-50">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
                <span class="text-white font-bold">SP</span>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">SECUREPULSE</h1>
        </div>

        <nav class="space-y-2">
            <a href="/" class="flex items-center gap-3 p-3 hover:bg-slate-800 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                Dashboard
            </a>
            <a href="/assets" class="flex items-center gap-3 p-3 bg-primary/10 text-primary rounded-xl font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
                Assets
            </a>
        </nav>
    </div>

    <!-- Main Content -->
    <main class="ml-64 p-8">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-3xl font-bold text-white mb-1">Asset Inventory</h2>
                <p class="text-slate-400">Manage and monitor all discovered devices.</p>
            </div>
            <button class="px-6 py-3 bg-primary hover:bg-blue-600 rounded-xl font-bold transition-all shadow-lg shadow-blue-500/20"
                    hx-post="http://localhost:8006/scan?subnet=10.0.1.0/24" hx-swap="none">
                Trigger Network Scan
            </button>
        </header>

        <!-- Asset Table -->
        <div class="glass rounded-3xl overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-800/50 text-slate-400 uppercase text-xs tracking-widest">
                    <tr>
                        <th class="p-6">Hostname</th>
                        <th class="p-6">IP Address</th>
                        <th class="p-6">OS</th>
                        <th class="p-6">Status</th>
                        <th class="p-6">Criticality</th>
                        <th class="p-6 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                    {% for asset in assets %}
                    <tr class="hover:bg-slate-800/30 transition-all">
                        <td class="p-6">
                            <div class="flex items-center gap-3">
                                <div class="w-2 h-2 rounded-full {% if asset.status == 'online' %} bg-success {% else %} bg-slate-500 {% endif %}"></div>
                                <span class="font-bold text-white">{{ asset.hostname }}</span>
                            </div>
                        </td>
                        <td class="p-6 font-mono text-sm">{{ asset.ip_address }}</td>
                        <td class="p-6 text-sm">{{ asset.os_type }}</td>
                        <td class="p-6">
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase 
                                {% if asset.status == 'online' %} bg-success/10 text-success
                                {% else %} bg-slate-800 text-slate-500 {% endif %}">
                                {{ asset.status }}
                            </span>
                        </td>
                        <td class="p-6">
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase
                                {% if asset.criticality == 'high' or asset.criticality == 'mission_critical' %} bg-danger/10 text-danger
                                {% else %} bg-primary/10 text-primary {% endif %}">
                                {{ asset.criticality }}
                            </span>
                        </td>
                        <td class="p-6 text-right">
                            <button class="text-primary hover:underline text-sm font-medium">Details</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
